# --- BEGIN_DEVICE_BYPASS ---
# --- END_DEVICE_BYPASS ---

# ==============================================================================
# OpenGFW 流量过滤与深度包检测 (DPI) 规则集（GUI 可视化管理版）
# 规则说明：规则按自上而下匹配，一旦命中带 action 的规则即终止判定
# ==============================================================================

# --- BEGIN_CUSTOM_RULES ---
# 自定义域名与 IP 拦截清单 (由【自定义拦截】控制台自动生成，支持热重载)
# --- END_CUSTOM_RULES ---

# ------------------------------------------------------------------------------
# 0. 用户自定义白名单（最高优先级，直接内核直通，杜绝误杀）
# ------------------------------------------------------------------------------
- name: allow whitelist tls
  action: allow
  expr: tls != nil && tls.sni != nil && geosite(tls.sni, "whitelist")

- name: allow whitelist http
  action: allow
  expr: http != nil && http.host != nil && geosite(http.host, "whitelist")

- name: allow whitelist quic
  action: allow
  expr: quic != nil && quic.sni != nil && geosite(quic.sni, "whitelist")

- name: allow whitelist dns
  action: allow
  expr: dns != nil && dns.name != nil && geosite(dns.name, "whitelist")

# ------------------------------------------------------------------------------
# 0.1 核心云服务、推送直通与防误杀（放行 Google / Apple / 微软 / 阿里 / 各厂商推送）
# ------------------------------------------------------------------------------
- name: allow essential cloud & push services tls
  action: allow
  expr: tls != nil && tls.sni != nil && (geosite(tls.sni, "google") || geosite(tls.sni, "apple") || geosite(tls.sni, "microsoft") || tls.sni contains "gvt2.com" || tls.sni contains "gvt1.com" || tls.sni contains "gvt3.com" || tls.sni contains "googleapis.com" || tls.sni contains "google.com" || tls.sni contains "gmail.com" || tls.sni contains "gstatic.com" || tls.sni contains "android.com" || tls.sni contains "push.apple.com" || tls.sni contains "amdc.alipay.com" || tls.sni contains "xmpush.xiaomi.com" || tls.sni contains "push.oppomobile.com" || tls.sni contains "push.vivo.com.cn" || tls.sni contains "push.hicloud.com" || tls.sni contains "sec.intl.miui.com")

- name: allow essential cloud & push services http
  action: allow
  expr: http != nil && http.host != nil && (geosite(http.host, "google") || http.host contains "gvt2.com" || http.host contains "gvt1.com" || http.host contains "gvt3.com" || http.host contains "googleapis.com" || http.host contains "google.com" || http.host contains "gmail.com" || http.host contains "gstatic.com" || http.host contains "android.com" || http.host contains "push.apple.com" || http.host contains "amdc.alipay.com" || http.host contains "xmpush.xiaomi.com" || http.host contains "push.oppomobile.com" || http.host contains "push.vivo.com.cn" || http.host contains "push.hicloud.com" || http.host contains "sec.intl.miui.com")

- name: allow essential cloud & push services quic
  action: allow
  expr: quic != nil && quic.sni != nil && (geosite(quic.sni, "google") || geosite(quic.sni, "apple") || geosite(quic.sni, "microsoft") || quic.sni contains "gvt2.com" || quic.sni contains "gvt1.com" || quic.sni contains "gvt3.com" || quic.sni contains "googleapis.com" || quic.sni contains "google.com" || quic.sni contains "gmail.com" || quic.sni contains "gstatic.com" || quic.sni contains "android.com" || quic.sni contains "push.apple.com" || quic.sni contains "amdc.alipay.com" || quic.sni contains "xmpush.xiaomi.com" || quic.sni contains "push.oppomobile.com" || quic.sni contains "push.vivo.com.cn" || quic.sni contains "push.hicloud.com" || quic.sni contains "sec.intl.miui.com")

- name: allow essential cloud & push services dns
  action: allow
  expr: dns != nil && dns.name != nil && (geosite(dns.name, "google") || geosite(dns.name, "apple") || geosite(dns.name, "microsoft") || dns.name contains "gvt2.com" || dns.name contains "gvt1.com" || dns.name contains "gvt3.com" || dns.name contains "googleapis.com" || dns.name contains "google.com" || dns.name contains "gmail.com" || dns.name contains "gstatic.com" || dns.name contains "android.com" || dns.name contains "push.apple.com" || dns.name contains "amdc.alipay.com" || dns.name contains "xmpush.xiaomi.com" || dns.name contains "push.oppomobile.com" || dns.name contains "push.vivo.com.cn" || dns.name contains "push.hicloud.com" || dns.name contains "sec.intl.miui.com")




# ------------------------------------------------------------------------------

# 1. 核心基础设施与管理端口放行（确保 SSH 与后台管理绝对安全）
# ------------------------------------------------------------------------------
- name: allow ssh
  action: allow
  expr: port.dst == 22 || port.src == 22

- name: allow router web management
  action: allow
  expr: (port.dst == 80 || port.dst == 443) && (cidr(ip.dst, "10.0.0.0/8") || cidr(ip.dst, "172.16.0.0/12") || cidr(ip.dst, "192.168.0.0/16"))

# ------------------------------------------------------------------------------
# 2. DNS 规避防范（阻断 DoT 与公共 DoH，迫使设备使用路由器本地安全 DNS）
# ------------------------------------------------------------------------------
# [DISABLED] - name: block dot 853
#   action: block
#   log: true
#   expr: port.dst == 853

# [DISABLED] - name: block doh providers
#   action: block
#   log: true
#   expr: tls != nil && tls.sni != nil && geosite(tls.sni, "category-doh")

# ------------------------------------------------------------------------------
# 3. 广告拦截规则组（基于 51.7万+ 条规则库底层透明过滤）
# ------------------------------------------------------------------------------
- name: block ads tls
  action: block
  log: true
  expr: tls != nil && tls.sni != nil && (geosite(tls.sni, "category-ads-all") || geosite(tls.sni, "adblockfilters"))

- name: block ads http
  action: block
  log: true
  expr: http != nil && http.host != nil && (geosite(http.host, "category-ads-all") || geosite(http.host, "adblockfilters"))

- name: block ads quic
  action: block
  log: true
  expr: quic != nil && quic.sni != nil && (geosite(quic.sni, "category-ads-all") || geosite(quic.sni, "adblockfilters"))

# 将广告域名的 DNS 应答解析修改为 0.0.0.0（温和黑洞）
# [DISABLED] - name: sinkhole ads dns
#   action: modify
#   log: true
#   expr: dns != nil && dns.qr && dns.name != nil && (geosite(dns.name, "category-ads-all") || geosite(dns.name, "adblockfilters"))
#   modifier:
#     name: dns
#     args:
#       a: "0.0.0.0"

# ------------------------------------------------------------------------------
# 5. 木马/病毒外联防线(2026-10-12 启用)
#    FET: 每个 TCP 流首包识别「全加密且非 TLS/HTTP」流量(Shadowsocks/VMess 类 C2 特征)
#    Trojan: 识别 Trojan 协议特征。若发现正常游戏/软件被误杀,注释掉这两条即可。
# ------------------------------------------------------------------------------
- name: block fully-encrypted
  action: block
  log: true
  expr: fet != nil && fet.yes

- name: block trojan
  action: block
  log: true
  expr: trojan != nil && trojan.yes

# ------------------------------------------------------------------------------
# 6. 流量审计与观察模式（在日志中打印所有内网终端访问的 TLS 域名）
# ------------------------------------------------------------------------------
- name: observe tls sni
  log: true
  expr: tls != nil && tls.sni != ""
